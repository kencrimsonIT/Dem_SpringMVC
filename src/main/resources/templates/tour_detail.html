<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${tour.description}">Chi tiết tour</title>
</head>
<body>
    <main>
        <div class="page-header">
            <h1 th:text="${tour.description}">Tên tour</h1>
            <p class="subtitle">
                <span th:text="${tour.days}">N ngày M đêm</span>
                &nbsp;·&nbsp;
                <strong>Phương tiện:</strong>
                <span th:text="${tour.transportation}">—</span>
                &nbsp;·&nbsp;
                <strong>Lịch khởi hành:</strong>
                <span th:text="${tour.departureSchedule}">—</span>
            </p>
        </div>

        <div class="card">
            <div style="margin-bottom: 1.8rem;">
                <div class="detail-grid">
                    <span class="label">Số ngày</span>
                    <span class="value" th:text="${tour.days}">—</span>

                    <span class="label">Phương tiện</span>
                    <span class="value" th:text="${tour.transportation}">—</span>

                    <span class="label">Lịch khởi hành</span>
                    <span class="value" th:text="${tour.departureSchedule}">—</span>

                    <span class="label">Giá tour</span>
                    <span class="value" style="font-weight:600; color: var(--gold);">
                        <span th:text="${#numbers.formatInteger(tour.price, 1, 'COMMA')}">0</span>
                        &nbsp;VNĐ / người
                    </span>
                </div>
            </div>

            <div>
                <p class="form-section-title" style="margin-bottom: 1rem;">Chương trình chi tiết</p>
                <div style="font-size: 0.9rem; line-height: 1.8; color: var(--ink);"
                     th:utext="${tour.description != null ? tour.description : 'Chưa có thông tin chi tiết.'}">
                    Nội dung chương trình...
                </div>
            </div>

            <div class="form-actions">
                <a class="btn btn-primary"
                   th:href="@{/book_tour/{id}(id=${tour.id})}">Đặt tour</a>
                <a class="btn btn-outline"
                   th:href="@{/list_tour}">← Chương trình tour</a>
            </div>
        </div>
    </main>
</body>
</html>
